<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班級點數小幫手</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel (讓瀏覽器能直接解析 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.4); border-radius: 20px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.7); }
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#f0f8f1]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 圖示元件庫 (替代 lucide-react，確保能在單一檔案完美執行) ---
    const Icon = ({ children, size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const User = (p) => <Icon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
    const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const Dices = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M8 8h.01"/><path d="M16 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></Icon>;
    const Timer = (p) => <Icon {...p}><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></Icon>;
    const Store = (p) => <Icon {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
    const Cat = (p) => <Icon {...p}><path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/></Icon>;
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
    const Pause = (p) => <Icon {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Icon>;
    const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></Icon>;
    const Trophy = (p) => <Icon {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
    const Sparkles = (p) => <Icon {...p}><path d="M12 3v18"/><path d="M3 12h18"/><path d="m18 6-6 6-6-6"/><path d="m6 18 6-6 6 6"/></Icon>;
    const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
    const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
    const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;

    const mockGroups = [
      { id: 'A', name: '猛虎小隊', points: 45 },
      { id: 'B', name: '飛鷹小隊', points: 52 },
      { id: 'C', name: '神龍小隊', points: 38 },
    ];

    // --- 主應用程式 ---
    const App = () => {
      const [authStatus, setAuthStatus] = useState('loading'); 
      const [userEmail, setUserEmail] = useState('');
      const APPLICATION_FORM_URL = "https://forms.google.com/"; // <-- 在這裡換成你的表單網址
      const [logs, setLogs] = useState([]);
      const [selectedStudentId, setSelectedStudentId] = useState('');
      const [activeFeature, setActiveFeature] = useState(null);
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState(mockGroups);
      const [timeLeft, setTimeLeft] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerRef = useRef(null);
      const [pickedStudent, setPickedStudent] = useState(null);
      const [isPicking, setIsPicking] = useState(false);
      const [isManagingStudents, setIsManagingStudents] = useState(false);
      const [batchInput, setBatchInput] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((response) => {
              if (response.success) {
                setStudents(response.data || []);
                setUserEmail(response.email);
                setAuthStatus('authorized');
              } else if (response.error === 'unauthorized') {
                setUserEmail(response.email);
                setAuthStatus('unauthorized');
              }
              setIsLoading(false);
            })
            .withFailureHandler((error) => {
              console.error("載入失敗:", error);
              setAuthStatus('error');
              setIsLoading(false);
            })
            .getMyStudents();
        } else {
          // 本機測試假資料
          setTimeout(() => {
            setAuthStatus('authorized');
            setUserEmail('teacher@school.edu.tw');
            setIsLoading(false);
          }, 1000);
        }
      }, []);

      useEffect(() => {
        if (isTimerRunning && timeLeft > 0) {
          timerRef.current = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
        } else if (timeLeft === 0) {
          setIsTimerRunning(false);
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerRunning, timeLeft]);

      const handleAddLog = (type, points, targetName, icon = Plus, color = 'bg-blue-100 text-blue-600') => {
        const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
        const newLog = { id: Date.now(), type, points, time, color, icon, target: targetName };
        setLogs(prev => [newLog, ...prev].slice(0, 5));
      };

      const updatePoints = (studentId, points, targetName) => {
        setStudents(prev => prev.map(s => s.id === studentId ? { ...s, points: s.points + points } : s));
        handleAddLog('表現加分', points, targetName, User, 'bg-purple-100 text-purple-600');
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.updateStudentPoints(studentId, points);
        }
      };

      const handleQuickAddPoints = (points) => {
        if (!selectedStudentId) { alert("請先選擇學生或全班！"); return; }
        if (selectedStudentId === 'all') {
          setStudents(prev => prev.map(s => {
            if (typeof google !== 'undefined' && google.script) google.script.run.updateStudentPoints(s.id, points);
            return { ...s, points: s.points + points };
          }));
          handleAddLog('全班獎勵', points, '全班');
        } else {
          const student = students.find(s => s.id.toString() === selectedStudentId);
          if (student) updatePoints(student.id, points, student.name);
        }
        setSelectedStudentId('');
      };

      const handleBatchAdd = () => {
        if (!batchInput.trim()) return;
        const newNames = batchInput.split('\n').map(n => n.trim()).filter(n => n);
        const tempStudents = newNames.map((name, i) => ({ id: Date.now() + i, name, points: 0, group: '未分組' }));
        setStudents(prev => [...prev, ...tempStudents]);
        setBatchInput('');
        setIsLoading(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(() => {
              google.script.run.withSuccessHandler((res) => {
                if(res.success) setStudents(res.data);
                setIsLoading(false);
              }).getMyStudents();
            })
            .batchAddStudents(newNames);
        } else {
          setIsLoading(false);
        }
      };

      const updateStudentName = (id, newName) => {
        setStudents(prev => prev.map(s => s.id === id ? { ...s, name: newName } : s));
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.updateStudentName(id, newName);
        }
      };

      const removeStudent = (id) => {
        if(window.confirm('確定要移除這位學生嗎？')) {
          setStudents(prev => prev.filter(s => s.id !== id));
          if (typeof google !== 'undefined' && google.script) google.script.run.deleteStudent(id);
        }
      };

      const addGroupPoints = (groupId, points) => {
         const group = groups.find(g => g.id === groupId);
         if(group) {
           setGroups(prev => prev.map(g => g.id === groupId ? { ...g, points: g.points + points } : g));
           handleAddLog('小組表現', points, group.name, Users, 'bg-orange-100 text-orange-600');
         }
      };

      const pickRandomStudent = () => {
        if (students.length === 0) return;
        setIsPicking(true);
        setPickedStudent(null);
        let count = 0;
        const interval = setInterval(() => {
          setPickedStudent(students[Math.floor(Math.random() * students.length)]);
          if (++count > 20) {
            clearInterval(interval);
            setIsPicking(false);
          }
        }, 100);
      };

      const toggleTimer = () => setIsTimerRunning(!isTimerRunning);
      const resetTimer = () => { setIsTimerRunning(false); setTimeLeft(300); };
      const formatTime = (seconds) => `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;

      // 載入畫面
      if (authStatus === 'loading') {
        return (
          <div className="min-h-screen bg-[#f0f8f1] flex flex-col items-center justify-center">
            <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-500 mb-6"></div>
            <h2 className="text-2xl font-bold text-gray-700">正在驗證您的身分...</h2>
            <p className="text-gray-500 mt-2">載入雲端資料庫</p>
          </div>
        );
      }

      // 阻擋畫面
      if (authStatus === 'unauthorized') {
        return (
          <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">
            <div className="bg-white max-w-md w-full p-8 rounded-[2rem] shadow-xl text-center border border-gray-100 transition-all">
               <div className="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                 <Lock size={40} className="text-red-500" />
               </div>
               <h2 className="text-3xl font-extrabold text-gray-800 mb-2">權限未開通</h2>
               <p className="text-gray-500 mb-6 font-medium">
                 您的帳號 <span className="font-bold text-blue-600">{userEmail}</span> 尚未開通使用權限。<br/>
                 請先填寫申請表，待管理員審核通過後即可登入使用。
               </p>
               <a href={APPLICATION_FORM_URL} target="_blank" className="block w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-lg shadow-md">
                 前往填寫申請表單
               </a>
            </div>
          </div>
        );
      }

      const gridItems = [
        { title: '個人點數', bgColor: 'bg-red-400', icon: <User size={48} className="text-white drop-shadow-md" />, id: 'individual' },
        { title: '小組任務', bgColor: 'bg-orange-400', icon: <Users size={48} className="text-white drop-shadow-md" />, id: 'group' },
        { title: '隨機抽點', bgColor: 'bg-teal-400', icon: <Dices size={48} className="text-white drop-shadow-md" />, id: 'random' },
        { title: '課堂計時', bgColor: 'bg-blue-400', icon: <Timer size={48} className="text-white drop-shadow-md" />, id: 'timer' },
        { title: '兌換商店', bgColor: 'bg-purple-400', icon: <Store size={48} className="text-white drop-shadow-md" />, id: 'store' },
        { title: '寵物世界', bgColor: 'bg-green-400', icon: <Cat size={48} className="text-white drop-shadow-md" />, id: 'pet' },
      ];

      const renderFeatureContent = () => {
        switch (activeFeature) {
          case 'individual':
            return (
              <div className="flex flex-col gap-4">
                <div className="flex justify-end mb-2">
                  <button onClick={() => setIsManagingStudents(!isManagingStudents)} className="flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">
                    <Settings size={18} /> {isManagingStudents ? '完成管理' : '管理學生名單'}
                  </button>
                </div>
                {isManagingStudents ? (
                  <div className="flex flex-col md:flex-row gap-6">
                    <div className="flex-1 bg-blue-50 p-5 rounded-xl border border-blue-100">
                      <h4 className="font-bold text-blue-800 mb-3 flex items-center gap-2"><Plus size={18}/> 批次新增學生</h4>
                      <textarea value={batchInput} onChange={(e) => setBatchInput(e.target.value)} className="w-full h-48 p-3 rounded-lg border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3 resize-none text-gray-700" placeholder="請在此貼上學生姓名，每行一個名字&#10;例如:&#10;王大明&#10;陳小美" />
                      <button onClick={handleBatchAdd} className="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold shadow-sm">批次加入清單</button>
                    </div>
                    <div className="flex-1 bg-white p-5 rounded-xl border border-gray-200 shadow-sm max-h-[60vh] overflow-y-auto custom-scrollbar">
                      <h4 className="font-bold text-gray-800 mb-4 flex items-center gap-2">編輯現有學生 <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full text-sm">{students.length}人</span></h4>
                      {isLoading ? (
                        <div className="flex justify-center py-10"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div></div>
                      ) : (
                        <div className="flex flex-col gap-2">
                          {students.map(student => (
                            <div key={student.id} className="flex items-center gap-3 bg-gray-50 p-2 rounded-lg hover:bg-gray-100">
                               <input type="text" value={student.name} onChange={(e) => updateStudentName(student.id, e.target.value)} className="flex-1 bg-transparent border-none focus:ring-2 focus:ring-blue-300 px-2 py-1 rounded font-medium text-gray-700" />
                               <button onClick={() => removeStudent(student.id)} className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded" title="刪除此學生"><Trash2 size={18} /></button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {isLoading ? (
                        <div className="col-span-full flex flex-col items-center justify-center py-20"><div className="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-500 mb-4"></div><p className="text-gray-500 font-medium">資料同步中...</p></div>
                    ) : students.length === 0 ? (
                        <div className="col-span-full flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                          <Users size={48} className="text-gray-300 mb-4" />
                          <p className="text-gray-500 font-medium text-lg mb-2">目前還沒有學生資料喔</p>
                          <button onClick={() => setIsManagingStudents(true)} className="text-blue-500 hover:text-blue-700 font-bold">前往管理名單新增</button>
                        </div>
                    ) : (
                      students.map(student => (
                        <div key={student.id} className="bg-white p-4 rounded-xl border border-gray-100 flex flex-col items-center shadow-sm hover:shadow-md transition-shadow">
                          <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mb-2"><User className="text-blue-600" /></div>
                          <h4 className="font-bold text-gray-800 text-lg">{student.name}</h4>
                          <p className="text-gray-500 text-sm mb-3 font-mono">點數: {student.points}</p>
                          <div className="flex gap-2 w-full">
                            <button onClick={() => updatePoints(student.id, -1, student.name)} className="flex-1 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-bold">-1</button>
                            <button onClick={() => updatePoints(student.id, 1, student.name)} className="flex-1 py-1.5 bg-green-50 text-green-600 rounded-lg hover:bg-green-100 font-bold">+1</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            );
          
          case 'group':
            return (
              <div className="flex flex-col gap-4">
                 {groups.map(group => (
                   <div key={group.id} className="bg-white p-5 rounded-xl border border-gray-100 flex items-center justify-between shadow-sm">
                      <div className="flex items-center gap-4">
                        <div className="w-14 h-14 bg-orange-100 rounded-full flex items-center justify-center"><Trophy className="text-orange-600" size={28} /></div>
                        <div><h4 className="font-bold text-xl text-gray-800">{group.name}</h4><p className="text-gray-500 font-mono mt-1">小組總分: {group.points}</p></div>
                      </div>
                      <div className="flex gap-3">
                         <button onClick={() => addGroupPoints(group.id, 2)} className="px-5 py-2 bg-blue-100 text-blue-700 font-bold rounded-lg">+2</button>
                         <button onClick={() => addGroupPoints(group.id, 5)} className="px-5 py-2 bg-green-100 text-green-700 font-bold rounded-lg">+5</button>
                      </div>
                   </div>
                 ))}
              </div>
            );

          case 'random':
            return (
              <div className="flex flex-col items-center justify-center py-10">
                <div className={`w-56 h-56 rounded-full border-[10px] ${isPicking ? 'border-teal-300 bg-teal-50' : 'border-teal-500 bg-white'} flex items-center justify-center mb-8 shadow-xl transition-all`}>
                  {pickedStudent ? (
                    <div className="text-center">
                      <div className="text-4xl font-bold text-gray-800 mb-2">{pickedStudent.name}</div>
                      <div className="text-teal-600 font-mono bg-teal-100 px-3 py-1 rounded-full inline-block">點數: {pickedStudent.points}</div>
                    </div>
                  ) : <Dices size={80} className="text-teal-400" />}
                </div>
                <button onClick={pickRandomStudent} disabled={isPicking || students.length === 0} className="bg-teal-500 hover:bg-teal-600 text-white text-xl font-bold py-4 px-12 rounded-full shadow-lg disabled:opacity-50">
                  {isPicking ? '命運轉盤中...' : (students.length === 0 ? '請先新增學生' : '開始抽點')}
                </button>
                {pickedStudent && !isPicking && (
                  <div className="mt-8 flex gap-4">
                     <button onClick={() => { updatePoints(pickedStudent.id, 2, pickedStudent.name); setPickedStudent(null); }} className="px-8 py-3 bg-green-500 text-white font-bold rounded-xl shadow">答對 +2</button>
                     <button onClick={() => setPickedStudent(null)} className="px-8 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl shadow">略過</button>
                  </div>
                )}
              </div>
            );

          case 'timer':
            return (
              <div className="flex flex-col items-center py-10">
                <div className={`text-8xl md:text-[10rem] font-mono font-bold mb-10 tracking-wider ${timeLeft <= 60 ? 'text-red-500' : 'text-gray-800'}`}>{formatTime(timeLeft)}</div>
                <div className="flex gap-6">
                  <button onClick={toggleTimer} className={`w-20 h-20 rounded-full flex items-center justify-center text-white shadow-xl ${isTimerRunning ? 'bg-orange-500' : 'bg-blue-500'}`}>
                    {isTimerRunning ? <Pause size={40} /> : <Play size={40} className="ml-2" />}
                  </button>
                  <button onClick={resetTimer} className="w-20 h-20 rounded-full flex items-center justify-center bg-gray-200 text-gray-700 shadow-xl"><RotateCcw size={36} /></button>
                </div>
                <div className="mt-12 flex gap-4">
                  <button onClick={() => {setIsTimerRunning(false); setTimeLeft(60);}} className="px-6 py-3 bg-white border-2 border-gray-200 font-bold rounded-xl hover:bg-gray-50">1 分鐘</button>
                  <button onClick={() => {setIsTimerRunning(false); setTimeLeft(300);}} className="px-6 py-3 bg-white border-2 border-gray-200 font-bold rounded-xl hover:bg-gray-50">5 分鐘</button>
                  <button onClick={() => {setIsTimerRunning(false); setTimeLeft(600);}} className="px-6 py-3 bg-white border-2 border-gray-200 font-bold rounded-xl hover:bg-gray-50">10 分鐘</button>
                </div>
              </div>
            );

          case 'store':
          case 'pet':
            return (
              <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                 <Store size={64} className="mb-4 opacity-50"/>
                 <p className="text-xl font-bold">即將推出 (Coming Soon)</p>
              </div>
            );
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-[#f0f8f1] font-sans flex flex-col relative">
          <div className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 flex flex-col z-10">
            <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 className="text-4xl md:text-5xl font-extrabold text-gray-800 flex items-center gap-3 tracking-tight">
                  <span className="text-yellow-500 text-4xl drop-shadow-sm">✨</span> 班級點數
                </h1>
                <p className="text-gray-600 mt-3 text-lg font-medium flex items-center gap-4">
                  一起努力，創造更棒的班級！ 
                  <span className="bg-white/90 px-4 py-1.5 rounded-full text-sm shadow-sm inline-flex items-center gap-2 border border-gray-100">
                    <User size={14} className="text-blue-500"/> {userEmail ? userEmail.split('@')[0] : '載入中'} 老師
                  </span>
                </p>
              </div>
              {isTimerRunning && activeFeature !== 'timer' && (
                 <button onClick={() => setActiveFeature('timer')} className="bg-blue-100 px-5 py-2.5 rounded-full border border-blue-200 shadow-md flex items-center gap-2">
                    <Timer size={20} className="text-blue-600" />
                    <span className="font-mono font-bold text-blue-800 tracking-wider">{formatTime(timeLeft)}</span>
                 </button>
              )}
            </header>

            <div className="flex flex-col lg:flex-row gap-8 flex-1">
              <div className="flex-1 grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-8 bg-white/60 p-6 md:p-8 rounded-[2rem] shadow-sm border border-white">
                {gridItems.map((item, index) => (
                  <button key={index} onClick={() => setActiveFeature(item.id)} className={`${item.bgColor} rounded-[2rem] p-6 flex flex-col items-center justify-center gap-5 transition-all shadow-md aspect-square relative overflow-hidden border-2 border-white/20`}>
                    <div className="bg-white/20 p-5 rounded-2xl border border-white/30 shadow-inner">{item.icon}</div>
                    <span className="text-white font-extrabold text-2xl md:text-3xl drop-shadow-md tracking-wider">{item.title}</span>
                  </button>
                ))}
              </div>

              <div className="w-full lg:w-[400px] flex flex-col gap-6">
                <div className="bg-teal-500/10 rounded-[2rem] p-6 border border-teal-500/20 shadow-sm flex-1 flex flex-col min-h-[350px]">
                  <h2 className="text-teal-900 font-bold mb-5 flex items-center gap-2 text-xl"><Sparkles size={24} className="text-teal-600"/> 最近加分紀錄</h2>
                  <div className="flex flex-col gap-3 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    {logs.map((log) => {
                       const LogIcon = log.icon;
                       return (
                      <div key={log.id} className="bg-white rounded-2xl p-4 flex flex-col justify-center shadow-sm border border-white">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-full ${log.color} flex items-center justify-center shrink-0 shadow-inner`}><LogIcon size={24} /></div>
                            <div className="flex flex-col"><span className="font-bold text-gray-800 text-lg">{log.type}</span><span className="text-sm text-gray-500 font-medium">{log.target}</span></div>
                          </div>
                          <div className="flex flex-col items-end">
                            <span className={`${log.points > 0 ? 'text-green-500' : 'text-red-500'} font-black text-2xl drop-shadow-sm`}>{log.points > 0 ? '+' : ''}{log.points}</span>
                            <span className="text-gray-400 text-xs font-mono">{log.time}</span>
                          </div>
                        </div>
                      </div>
                    )})}
                    {logs.length === 0 && <p className="text-teal-600/50 text-center py-10 font-medium">目前還沒有紀錄喔！</p>}
                  </div>
                </div>

                <div className="bg-white rounded-[2rem] p-6 shadow-md border border-gray-100 flex flex-col gap-5">
                  <h2 className="text-gray-800 font-bold flex items-center gap-2 text-xl">⚡ 快速加分</h2>
                  <div className="flex gap-3">
                    {[1, 2, 5].map((points) => (
                      <button key={points} onClick={() => handleQuickAddPoints(points)} className="flex-1 bg-blue-50 text-blue-700 font-black text-xl py-4 rounded-2xl shadow-sm border border-blue-200 hover:bg-blue-100">
                        +{points}
                      </button>
                    ))}
                  </div>
                  <div className="relative mt-2">
                    <select value={selectedStudentId} onChange={(e) => setSelectedStudentId(e.target.value)} className="w-full bg-gray-50 border-2 border-gray-200 text-gray-800 font-medium rounded-xl px-4 py-4 appearance-none focus:outline-none focus:border-blue-400 cursor-pointer text-lg">
                      <option value="" disabled>請選擇要加分的學生或全班...</option>
                      <option value="all">🌟 獎勵全班</option>
                      <optgroup label="個別學生">
                        {students.map(s => <option key={s.id} value={s.id}>{s.name} (目前: {s.points}點)</option>)}
                      </optgroup>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {activeFeature && (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-[2.5rem] max-w-5xl w-full p-6 md:p-10 shadow-2xl relative max-h-[90vh] flex flex-col border border-gray-100">
                <div className="flex justify-between items-center mb-8 shrink-0 border-b border-gray-100 pb-4">
                  <h3 className="text-4xl font-extrabold text-gray-800 tracking-wide">{gridItems.find(i => i.id === activeFeature)?.title}</h3>
                  <button onClick={() => { setActiveFeature(null); setIsManagingStudents(false); }} className="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full p-3"><X size={32} /></button>
                </div>
                <div className="flex-1 overflow-y-auto custom-scrollbar pr-4">
                   {renderFeatureContent()}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
